name: Сбор данных киллборда
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/collect.mjs
      - name: Сохранить данные
        run: |
          git config user.name "karavan-bot"
          git config user.email "karavan-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Данные киллборда $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push)
